<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up - PrivySpace</title>
  <link rel="stylesheet" href="../src/css/style.css">
</head>
<body>
<div id="wrapper">
  <div id="header"><h1>PrivySpace</h1><p>Signup Page</p></div>
  <div id="nav"><a href="../index.html">Home</a> <a href="login.html">Login</a> <a href="about.html">About Us</a></div>
  <div id="content">
    <div class="box login-box">
      <h2>Create Account</h2>
      <form id="signupForm">
        <label>Full Name</label>
        <input type="text" id="signupName" required>
        <label>Email</label>
        <input type="email" id="signupEmail" required>
        <label>Password</label>
        <input type="password" id="signupPassword" required>
        <br><button type="submit">Sign Up</button>
      </form>
      <p>Done? <a href="login.html">Go to login</a>.</p>
    </div>
  </div>
  <div class="footer">PrivySpace WebDev Pa Midterm ni sir Ammiel</div>
</div>
<script src="../src/js/main.js"></script>
</body>
</html>
